[project]
name = "casalorenzi-backend"
version = "0.2.0"
description = "API da plataforma integrada Casa Lorenzi"
requires-python = ">=3.11"

[tool.ruff]
line-length = 130
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# E/F: erros e nomes não usados · I: ordem dos imports · B: armadilhas comuns · UP: sintaxe moderna
select = ["E", "F", "I", "B", "UP"]
# B008: Depends() nos parâmetros é o padrão do FastAPI
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# Tabelas de dados de demonstração e testes ficam mais legíveis em linhas longas
"src/database/seed/*" = ["E501"]
"tests/*" = ["E501"]

[tool.ruff.format]
quote-style = "double"
